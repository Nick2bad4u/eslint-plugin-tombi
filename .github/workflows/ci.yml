name: "Continuous Integration"

run-name: "Continuous Integration - ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

permissions:
    contents: "read"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"
        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Setup declared npm version"
              id: "npm"
              working-directory: "${{ runner.temp }}"
              env:
                  PROJECT_PACKAGE_JSON: "${{ github.workspace }}/package.json"
              run: |
                  set -euo pipefail

                  package_manager="$(
                    node -e "
                      const fs = require('node:fs');
                      const packageJson = JSON.parse(
                        fs.readFileSync(process.env.PROJECT_PACKAGE_JSON, 'utf8'),
                      );
                      process.stdout.write(packageJson.packageManager ?? '');
                    "
                  )"

                  if [[ "${package_manager}" =~ ^npm@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                    npm install --global --ignore-scripts --no-audit --no-fund \
                      "npm@${BASH_REMATCH[1]}"
                  else
                    echo "::error title=Invalid npm packageManager::Expected an exact npm version, received ${package_manager}."
                    exit 1
                  fi

                  npm --version
                  echo "cache_dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"

            - name: "Restore npm cache"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm.outputs.cache_dir }}"
                  key: "npm-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}"
                  restore-keys: "npm-${{ runner.os }}-"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Verify generated docs tables"
              run: |
                  npm run sync:readme-rules-table
                  npm run sync:presets-rules-matrix

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npx vitest run --coverage --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --silent"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    eslint9-compat:
        name: "ESLint 9 Compatibility (${{ matrix.label }})"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - eslint-js-version: "9.0.0"
                      eslint-version: "9.0.0"
                      label: "9.0.0"
                    - eslint-js-version: "^9.39.1"
                      eslint-version: "^9.39.1"
                      label: "9.latest"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Setup declared npm version"
              id: "npm"
              working-directory: "${{ runner.temp }}"
              env:
                  PROJECT_PACKAGE_JSON: "${{ github.workspace }}/package.json"
              run: |
                  set -euo pipefail

                  package_manager="$(
                    node -e "
                      const fs = require('node:fs');
                      const packageJson = JSON.parse(
                        fs.readFileSync(process.env.PROJECT_PACKAGE_JSON, 'utf8'),
                      );
                      process.stdout.write(packageJson.packageManager ?? '');
                    "
                  )"

                  if [[ "${package_manager}" =~ ^npm@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                    npm install --global --ignore-scripts --no-audit --no-fund \
                      "npm@${BASH_REMATCH[1]}"
                  else
                    echo "::error title=Invalid npm packageManager::Expected an exact npm version, received ${package_manager}."
                    exit 1
                  fi

                  npm --version
                  echo "cache_dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"

            - name: "Restore npm cache"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm.outputs.cache_dir }}"
                  key: "npm-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}"
                  restore-keys: "npm-${{ runner.os }}-"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Install ESLint 9 runtime for compatibility smoke checks"
              run: "npm install --no-save --ignore-scripts eslint@${{ matrix.eslint-version }} @eslint/js@${{ matrix.eslint-js-version }}"

            - name: "Run ESLint 9 compatibility smoke checks"
              run: "npm run lint:compat:eslint9 -- --expect-eslint-major=9"
