# Deploy Docusaurus site to GitHub Pages
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Deploy Docusaurus To GitHub Pages"

run-name: "Deploy Docusaurus - ${{ github.ref_name }} @${{ github.actor }}"

on:
    push:
        branches:
            - "main"
        paths:
            - ".github/workflows/deploy-docusaurus.yml"
            - ".node-version"
            - ".nvmrc"
            - "docs/docusaurus/**"
            - "docs/rules/**"
            - "package.json"
            - "package-lock.json"
            - "src/**"
            - "tsdoc.json"
    workflow_dispatch:

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        name: "Build Docs Site"
        runs-on: "ubuntu-latest"
        timeout-minutes: 40
        permissions:
            contents: "read"
            pages: "write"
            id-token: "write"
        defaults:
            run:
                shell: "bash"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Setup declared npm version"
              id: "npm"
              working-directory: "${{ runner.temp }}"
              env:
                  PROJECT_PACKAGE_JSON: "${{ github.workspace }}/package.json"
              run: |
                  set -euo pipefail

                  package_manager="$(
                    node -e "
                      const fs = require('node:fs');
                      const packageJson = JSON.parse(
                        fs.readFileSync(process.env.PROJECT_PACKAGE_JSON, 'utf8'),
                      );
                      process.stdout.write(packageJson.packageManager ?? '');
                    "
                  )"

                  if [[ "${package_manager}" =~ ^npm@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                    npm install --global --ignore-scripts --no-audit --no-fund \
                      "npm@${BASH_REMATCH[1]}"
                  else
                    echo "::error title=Invalid npm packageManager::Expected an exact npm version, received ${package_manager}."
                    exit 1
                  fi

                  npm --version
                  echo "cache_dir=$(npm config get cache)" >> "${GITHUB_OUTPUT}"

            - name: "Restore npm cache"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm.outputs.cache_dir }}"
                  key: "npm-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}"
                  restore-keys: "npm-${{ runner.os }}-"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Build Docusaurus site"
              run: "npm run docs:build"

            - name: "List TypeDoc output directories"
              run: |
                  echo "TypeDoc output directories:"
                  ls -l docs/docusaurus/site-docs || true
                  ls -l docs || true

            - name: "Setup GitHub Pages"
              uses: "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d" # v6.0.0
              with:
                  enablement: true

            - name: "Upload pages artifact"
              uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
              with:
                  path: "docs/docusaurus/build"

    deploy:
        name: "Deploy Site"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        needs: "build"
        outputs:
            page_url: "${{ steps.deployment.outputs.page_url }}"
        permissions:
            pages: "write"
            id-token: "write"
        environment:
            name: "github-pages"
            url: "${{ steps.deployment.outputs.page_url }}"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Deploy to GitHub Pages"
              id: "deployment"
              uses: "actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128" # v5.0.0
